name: API changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./tools/merge-docs
      - name: Post or update the API changes comment
        run: python -m merge_docs.cli.pr_comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
